<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run Local</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='%2334d399'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f4f2;--card:#fff;--line:#e4e4e0;--fg:#141516;--mut:#71757c;--soft:#ececea;
  --acc:#10b981;--acc-ink:#047857;--warn:#d97706;--bad:#dc2626;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d0e10;--card:#17181b;--line:#25272b;--fg:#ecedef;--mut:#8b9098;--soft:#1e2023;
  --acc:#34d399;--acc-ink:#6ee7b7;--warn:#fbbf24;--bad:#f87171;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:#111;display:grid;place-items:center}
h1{font-size:19px;font-weight:680;margin:0;letter-spacing:-.01em}
.sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:36px;min-width:220px}
.search input{border:0;outline:0;background:transparent;color:var(--fg);font:inherit;width:100%}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.danger:hover{color:var(--bad);border-color:var(--bad)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:28px 0 12px}

/* çalışanlar */
.running{display:grid;gap:8px}
.rrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.rrow .ico{width:40px;height:40px;border-radius:10px;flex:none}
.rrow .meta{min-width:0;flex:1}
.rrow .t{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow a.u{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--acc-ink);text-decoration:none}
.rrow a.u:hover{text-decoration:underline}
.rrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.state{font-size:12px;color:var(--mut)}

/* ızgara */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:22px 14px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border-radius:16px;cursor:pointer;user-select:none;text-align:center;border:0;background:none;color:inherit;font:inherit}
.app:hover{background:var(--soft)}
.app:active .ico{transform:scale(.95)}
.ico{position:relative;width:76px;height:76px;border-radius:19px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;transition:transform .15s}
.ico img{width:64%;height:64%;object-fit:contain}
.ico.full img{width:100%;height:100%;object-fit:cover}
.ico .mono{font-weight:700;font-size:28px;color:#fff;letter-spacing:-.02em}
.name{font-size:13px;font-weight:560;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:110px}
.sub{font-size:11px;color:var(--mut);margin-top:-5px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:8px;right:calc(50% - 46px);width:16px;height:16px;border-radius:50%;border:3px solid var(--bg);background:var(--acc);display:none}
.app:hover .badge{border-color:var(--soft)}
.app[data-st=running] .badge{display:block}
.app[data-st=error] .badge{display:block;background:var(--bad)}
.app[data-st=starting] .ico::after,.app[data-st=installing] .ico::after,.rrow[data-st=starting] .ico::after,.rrow[data-st=installing] .ico::after{
  content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--card) 55%,transparent);
  background-image:conic-gradient(var(--acc) 0 25%,transparent 0);-webkit-mask:radial-gradient(circle,transparent 56%,#000 57%,#000 64%,transparent 65%);mask:radial-gradient(circle,transparent 56%,#000 57%,#000 64%,transparent 65%);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.more{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:7px;border:0;background:transparent;color:var(--mut);cursor:pointer;opacity:0;display:grid;place-items:center}
.app:hover .more,.more:focus-visible{opacity:1}.more:hover{background:var(--line);color:var(--fg)}
.app.hidden-app{opacity:.45}
.vid{position:absolute;top:64px;right:calc(50% - 46px);width:24px;height:24px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;border:2.5px solid var(--bg);pointer-events:none}
.app:hover .vid{border-color:var(--soft)}
.vid svg{margin-left:1.5px}
/* klasörler (gruplar) */
.ico.folder{background:color-mix(in srgb,var(--fg) 8%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 6%,transparent),var(--shadow);display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:min-content;align-content:start;gap:5px;padding:10px;place-items:stretch}
.ico.folder .ico.mini{width:auto;height:auto;aspect-ratio:1;border-radius:4.5px;box-shadow:none}
.ico.mini img{width:100%;height:100%}.ico.mini:not(.full) img{width:72%;height:72%}
.ico.mini .mono{font-size:7px}
.app.fold .ico{transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.app.merge .ico{transform:scale(1.14)}
.app.merge .ico:not(.folder){box-shadow:0 0 0 7px color-mix(in srgb,var(--fg) 10%,transparent),var(--shadow)}
.app.dragging{opacity:.3}
.app.drop-before::before,.app.drop-after::after{content:"";position:absolute;left:-9px;top:14px;height:72px;width:3px;border-radius:2px;background:var(--acc)}
.app.drop-after::after{left:auto;right:-9px}
body.dnd .app:hover{background:none}
.fov{position:fixed;inset:0;z-index:28;display:none}
.fov.on{display:block}
.fbg{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);opacity:0;transition:opacity .28s}
.fov.open .fbg{opacity:1}
.fwrap{position:absolute;left:50%;top:50%;width:min(620px,calc(100vw - 32px));transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px}
.ftitle{font:inherit;font-size:24px;font-weight:700;letter-spacing:-.02em;text-align:center;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:10px;padding:2px 10px;width:100%;max-width:420px;opacity:0;transition:opacity .2s}
.ftitle:hover{border-color:var(--line)}.ftitle:focus{outline:0;border-color:var(--acc);background:var(--card)}
.fov.open .ftitle{opacity:1}
.fpanel{width:100%;max-height:min(66vh,560px);overflow:auto;background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--line);border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.22);padding:22px 18px;transform-origin:0 0;will-change:transform}
.fpanel .grid{transition:opacity .18s .08s;opacity:0}
.fov.open .fpanel .grid{opacity:1}
.fhint{font-size:12px;color:var(--mut);opacity:0;transition:opacity .2s}
.fov.open .fhint{opacity:1}
.fov.out .fpanel{outline:2px dashed var(--acc);outline-offset:4px}
.upd{display:none;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 14px;margin-bottom:16px;font-size:13px;box-shadow:var(--shadow)}
.upd.on{display:flex}
@media (prefers-reduced-motion:reduce){.fpanel,.fbg,.ftitle,.fpanel .grid,.app.fold .ico{transition:none!important}}
.menu .lbl{font-size:11px;color:var(--mut);padding:6px 10px 2px}
.empty{color:var(--mut);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:14px}

/* menü */
.menu{position:fixed;z-index:38;min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:6px;display:none}
.menu.on{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;color:var(--fg);font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu .rn{display:flex;gap:6px;padding:4px}
.menu .rn input{flex:1;min-width:0;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:13px;padding:0 8px}
.menu .path{font:11px ui-monospace,Menlo,monospace;color:var(--mut);padding:6px 10px 4px;word-break:break-all}

/* log */
.sheet{position:fixed;inset:auto 0 0 0;z-index:30;max-height:62vh;display:none;flex-direction:column;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -12px 40px rgba(0,0,0,.18)}
.sheet.on{display:flex}
.sheet header{margin:0;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet pre{margin:0;padding:12px 16px;overflow:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all;flex:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;transition:.2s;pointer-events:none;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%)}

/* klasörler */
.modal{position:fixed;inset:0;z-index:35;display:none;place-items:center;background:rgba(0,0,0,.28);padding:16px}
.modal.on{display:grid}
.dlg{width:min(560px,100%);max-height:80vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.25);padding:20px}
.dlg h3{margin:0 0 4px;font-size:16px}
.dlg p.hint{margin:0 0 16px;color:var(--mut);font-size:13px}
.dlg section{padding:16px 0;border-top:1px solid var(--line)}
.dlg section:first-of-type{border-top:0;padding-top:8px}
.dlg h4{margin:0 0 4px;font-size:13px;font-weight:620}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--soft);border-radius:10px;margin-top:6px}
.seg button{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:560;height:30px;padding:0 14px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08),0 1px 6px rgba(0,0,0,.06)}
.frow .ico{width:28px;height:28px;border-radius:7px;flex:none}.frow .ico .mono{font-size:11px}
.frow .nm{flex:1;min-width:0;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .nm small{display:block;font:11.5px ui-monospace,Menlo,monospace;color:var(--mut);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.frow .btn.sm{font-size:12px}
.tgl{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;cursor:pointer}
.tgl input{width:16px;height:16px;accent-color:var(--acc);margin:0}
.frow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.frow code{flex:1;min-width:0;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .k{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.frow button:not(.btn){border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:6px}
.frow button:not(.btn):hover{color:var(--bad);background:var(--soft)}
.addrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.addrow input{flex:1;min-width:180px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:12.5px ui-monospace,Menlo,monospace;padding:0 10px}
@media (max-width:560px){.search{min-width:0;flex:1 1 100%;order:3}.rrow{flex-wrap:wrap}.rrow .acts{width:100%;justify-content:flex-start}}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><div class="logo"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 1.8v10.4L12 7z" fill="#34d399"/></svg></div><h1>Run Local</h1></div>
    <span class="state" id="count"></span>
    <span class="sp"></span>
    <label class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--mut)"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg><input id="q" data-i18n-ph="search" autocomplete="off"></label>
    <button class="btn" id="refresh" data-i18n="refresh" data-i18n-title="refreshTitle"></button>
    <button class="btn" id="settings"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.8M8 12.7v1.8M14.5 8h-1.8M3.3 8H1.5M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3M12.6 12.6l-1.3-1.3M4.7 4.7 3.4 3.4"/></svg><span data-i18n="settings"></span></button>
  </header>

  <div class="upd" id="upd"><span data-i18n="updMsg"></span><span class="sp"></span><button class="btn sm pri" id="restart" data-i18n="restart"></button></div>
  <section id="runWrap" hidden><h2 data-i18n="running"></h2><div class="running" id="running"></div></section>
  <div id="board"></div>
</main>

<div class="menu" id="menu"></div>
<div class="fov" id="fov"><div class="fbg" id="fbg"></div><div class="fwrap">
  <input class="ftitle gname" id="ftitle" data-i18n-aria="groupName" spellcheck="false">
  <div class="fpanel" id="fpanel"></div>
  <div class="fhint" data-i18n="folderHint"></div>
</div></div>
<div class="sheet" id="sheet"><header style="display:flex;align-items:center;gap:10px"><strong id="logTitle"></strong><span class="state" id="logState"></span><span class="sp"></span><button class="btn sm" id="logClose" data-i18n="close"></button></header><pre id="logBody"></pre></div>
<div class="modal" id="fmodal"><div class="dlg" role="dialog" aria-labelledby="fh">
  <h3 id="fh" data-i18n="settings"></h3>
  <section>
    <h4 data-i18n="language"></h4>
    <div class="seg" role="group" data-i18n-aria="language"><button data-lang="tr">Türkçe</button><button data-lang="en">English</button></div>
  </section>
  <section>
    <h4 data-i18n="folders"></h4>
    <p class="hint" data-i18n="foldersHint"></p>
    <div id="flist"></div>
    <div class="addrow"><button class="btn pri" id="fpick" data-i18n="pick"></button><input id="fpath" data-i18n-ph="pathPh" autocomplete="off"><button class="btn" id="fadd" data-i18n="add"></button></div>
  </section>
  <section>
    <h4 data-i18n="hiddenTitle"></h4>
    <p class="hint" data-i18n="hiddenHint"></p>
    <div id="hlist"></div>
    <label class="tgl"><input type="checkbox" id="showHidden"><span data-i18n="showInGrid"></span></label>
  </section>
  <div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn" id="fclose" data-i18n="done"></button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const post = (p) => fetch(p, { method: "POST", headers: { "x-rl": "1" } }).then((r) => r.json());
let projects = [], st = {}, groups = [], order = [], showHidden = false, logId = null, dragRel = null, dragFid = null;
try { showHidden = localStorage.rlHidden === "1"; } catch {}

// dil: Türkçe ve İngilizce. Seçim state.json'da durur; yoksa tarayıcı diline bakılır.

    hiddenTitle: "Gizlenenler", hiddenHint: "Gizlediğin projeler ızgarada görünmez. Buradan geri getirebilirsin.", noHidden: "Gizlenen proje yok", hiddenToast: (p) => `${p} gizlendi. Ayarlar'dan geri getirebilirsin`, showInGrid: "Gizlenenleri ızgarada soluk göster",

  en: {

  const p = projects.find((x) => x.id === id), s = st[id];
  menu.innerHTML = `<div class="path">${esc(p.rel)}</div>
    <button data-a="run">${s?.status === "running" ? t("openBrowser") : p.kind === "Xcode" ? t("openXcode") : t("run")}</button>
    ${s ? `<button data-a="stop">${t("stop")}</button>` : ""}
    <button data-a="log">${t("log")}</button><hr>
    <button data-a="reveal">${t("reveal")}</button>
    <button data-a="code">${t("code")}</button>
    <button data-a="rescan">${t("rescan")}</button><hr>
    <div class="rn"><input id="rn" value="${esc(p.name)}" aria-label="${t("name")}"><button class="btn sm" data-a="rename" style="width:auto">${t("save")}</button></div>
    <button data-a="hide">${p.hidden ? t("show") : t("hide")}</button><hr>
    <div class="lbl">${t("moveTo")}</div>
    ${groups.filter((g) => !g.items.includes(p.rel)).map((g) => `<button data-a="mv" data-g="${g.id}">${esc(g.name)}</button>`).join("")}
    <button data-a="mv" data-g="new">${t("newGroupDots")}</button>
    ${groups.some((g) => g.items.includes(p.rel)) ? `<button data-a="mv" data-g="">${t("removeFromGroup")}</button>` : ""}`;
  placeMenu(id, x, y);
}
function placeMenu(id, x, y) {
  menu.dataset.id = id; menu.classList.add("on");
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + "px";
  menu.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + "px";
}
const closeMenu = () => menu.classList.remove("on");
menu.addEventListener("click", async (e) => {
  const a = e.target.dataset.a, id = menu.dataset.id, p = projects.find((x) => x.id === id);
  if (!a) return;
  closeMenu();
  if (a === "run") runApp(id);
  if (a === "stop") { await post("/api/stop?id=" + id); toast(t("stopped", p.name)); setTimeout(loadStatus, 800); }
  if (a === "log") openLog(id);
  if (a === "reveal") post("/api/reveal?id=" + id);
  if (a === "code") post("/api/code?id=" + id);
  if (a === "rescan") { const r = await post("/api/rescan?id=" + id); await loadProjects(); toast(r.removed ? t("notProject", p.name) : t("refreshed", p.name)); }
  if (a === "hide") { await post("/api/hide?id=" + id + "&on=" + (p.hidden ? "0" : "1")); loadProjects(); if (!p.hidden) toast(t("hiddenToast", p.name)); }
  if (a === "mv") { const g = moveTo(p.rel, e.target.dataset.g); if (e.target.dataset.g !== "new") toast(g ? t("moved", p.name, g.name) : t("leftGroup", p.name)); }
  if (a === "rename") { await post("/api/rename?id=" + id + "&name=" + encodeURIComponent($("#rn")?.value || "")); loadProjects(true); }
});
menu.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.id === "rn") menu.querySelector("[data-a=rename]").click(); });

// log
async function loadLog() {
  const d = await (await fetch("/api/log?id=" + logId)).json();
  const pre = $("#logBody"), atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
  pre.textContent = d.log.length ? d.log.join("\n") : t("noLog");
  $("#logState").textContent = label(st[logId]?.status) || (d.status === "stopped" ? t("closed") : "");
  if (atEnd) pre.scrollTop = pre.scrollHeight;
}
function openLog(id) { logId = id; $("#logTitle").textContent = projects.find((p) => p.id === id).name; $("#sheet").classList.add("on"); loadLog(); }
$("#logClose").onclick = () => { logId = null; $("#sheet").classList.remove("on"); };

document.addEventListener("click", async (e) => {
  const more = e.target.closest("[data-more]");
  if (more) { e.stopPropagation(); const r = more.getBoundingClientRect(); return openMenu(more.dataset.more, r.right - 10, r.bottom + 4); }
  if (!e.target.closest("#menu")) closeMenu();
  const t = e.target.closest("[data-stop],[data-log]");
  if (t?.dataset.stop) { t.textContent = "…"; await post("/api/stop?id=" + t.dataset.stop); setTimeout(loadStatus, 800); return; }
  if (t?.dataset.log) return openLog(t.dataset.log);
  const app = e.target.closest(".app");
  if (app) runApp(app.dataset.id);
});
document.addEventListener("contextmenu", (e) => { const app = e.target.closest(".app"); if (app) { e.preventDefault(); openMenu(app.dataset.id, e.clientX, e.clientY); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeMenu(); $("#logClose").click(); $("#fclose").click(); }
  if (e.key === "Enter" && e.target.classList?.contains("app")) runApp(e.target.dataset.id);
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
$("#q").oninput = render;
$("#refresh").onclick = async () => { $("#refresh").textContent = t("scanning"); await loadProjects(true); $("#refresh").textContent = t("refresh"); toast(t("nFound", projects.length)); };
$("#showHidden").onchange = (e) => { showHidden = e.target.checked; try { localStorage.rlHidden = showHidden ? "1" : "0"; } catch {} render(); };
function renderHidden() {
  const h = projects.filter((p) => p.hidden);
  $("#hlist").innerHTML = h.map((p) => `<div class="frow">${icon(p)}<div class="nm">${esc(p.name)}<small>${esc(p.rel)}</small></div><button class="btn sm" data-unhide="${p.id}">${t("show")}</button></div>`).join("")
    || `<div class="empty">${t("noHidden")}</div>`;
}
document.addEventListener("click", async (e) => {
  const u = e.target.closest("[data-unhide]"); if (!u) return;
  await post("/api/hide?id=" + u.dataset.unhide + "&on=0"); await loadProjects();
});


// klasörler
async function loadFolders(d) {
  d = d || await (await fetch("/api/folders")).json();
  const row = (p, k) => `<div class="frow"><code title="${esc(p)}">${esc(p)}</code><span class="k">${k}</span><button data-frm="${esc(p)}" aria-label="${t("remove")}">×</button></div>`;
  $("#flist").innerHTML = d.roots.map((p) => row(p, t("kindFolder"))).join("") + d.extra.map((p) => row(p, t("kindProject"))).join("")
    || `<div class="empty">${t("noFolders")}</div>`;
}
function openFolders() { $("#fmodal").classList.add("on"); loadFolders(); renderHidden(); }
async function addFolder(q) {
  const r = await fetch("/api/folders/add?" + q, { method: "POST", headers: { "x-rl": "1" } }).then((r) => r.json());
  if (r.cancelled) return;
  if (r.error) return toast(t("folderNotFound"));
  loadFolders(r); $("#fpath").value = ""; await loadProjects(); loadStatus();
  toast(r.as === "project" ? t("projectAdded") : t("nFound", r.count));
}
$("#settings").onclick = openFolders;
$("#fclose").onclick = () => $("#fmodal").classList.remove("on");
$("#fmodal").onclick = (e) => { if (e.target.id === "fmodal") $("#fclose").click(); };
$("#fpick").onclick = async () => { $("#fpick").textContent = t("pickOpen"); await addFolder("pick=1"); $("#fpick").textContent = t("pick"); };
$("#fadd").onclick = () => $("#fpath").value.trim() && addFolder("path=" + encodeURIComponent($("#fpath").value.trim()));
$("#fpath").onkeydown = (e) => { if (e.key === "Enter") $("#fadd").click(); };
document.addEventListener("click", async (e) => {
  if (e.target.closest("[data-openfolders]")) return openFolders();
  const rm = e.target.closest("[data-frm]");
  if (rm) { loadFolders(await post("/api/folders/remove?path=" + encodeURIComponent(rm.dataset.frm))); await loadProjects(); }
});
applyLang();
fetch("/api/settings").then((r) => r.json()).then((c) => { order = c.order || []; if (L[c.lang]) { lang = c.lang; applyLang(); } }).catch(() => {})
  .then(() => fetch("/api/groups")).then((r) => r.json()).then((g) => { groups = g; return loadProjects(); }).then(loadStatus);
if (/^#(klasorler|ayarlar|settings)$/.test(location.hash)) openFolders();
checkVersion(); setInterval(() => document.hidden || checkVersion(), 15000);
setInterval(() => document.hidden || loadStatus(), 2500);
</script>
</body>
</html>
